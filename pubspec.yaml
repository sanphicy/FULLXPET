name: fullxpet
description: "FULLX PET 客户端应用程序"
publish_to: 'none'

# 应用版本号与构建号
version: 1.1.2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # 国际化多语言支持
  flutter_localizations:
    sdk: flutter
  intl: any

  # 状态管理
  provider: ^6.1.1

  # 路由管理
  go_router: ^13.1.0

  # 依赖注入与服务定位器
  get_it: ^7.6.4

  # 网络请求与拦截器
  dio: ^5.4.0

  # 安全加密存储（存储 Token 等）
  flutter_secure_storage: ^9.0.0

  # 图表组件（折线图等数据统计）
  fl_chart: ^1.2.0

  # 本地时区与时间转换
  flutter_timezone: ^3.0.0
  timezone: ^0.9.2

  # 屏幕多分辨率适配
  flutter_screenutil: ^5.9.3

  # 定时列表侧滑删除组件
  flutter_slidable: ^3.0.1

  # 打开外部帮助文档网页与 URL
  url_launcher: ^6.2.1

  # 蓝牙 BLE 扫描、连接与数据读写
  flutter_blue_plus: ^1.31.0

  # 动态权限申请
  permission_handler: ^11.3.0

  # 获取当前连接的 Wi-Fi SSID
  network_info_plus: ^5.0.0

  # MQTT 协议通信
  mqtt_client: ^10.0.0

  # 本地轻量键值对数据持久化
  shared_preferences: ^2.2.3

  # 相册选取与拍照
  image_picker: ^1.1.2

  # 获取应用包名与版本信息
  package_info_plus: ^8.0.0

  # 内嵌 WebView 网页展示
  webview_flutter: ^4.8.0

  # 桌面应用图标生成工具
  flutter_launcher_icons: ^0.13.1

  # 原生冷启动闪屏生成工具
  flutter_native_splash: ^2.4.0

  # iOS 风格图标库
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 官方静态代码规范分析
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # 静态资源文件目录
  assets:
    - assets/images/
    - assets/data/device_batch_mapping.json

# 应用桌面图标配置
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo-1024.png"
  remove_alpha_ios: true

# 原生启动闪屏配置
flutter_native_splash:
  color: "#FFFFFF" # 与业务闪屏白底保持一致
  image: assets/images/splash_brand.png

  # Android 12+ 独立适配
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_brand.png

  # iOS 启用
  ios: true